services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment: # reads variables from .env
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DP_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - db # waits for db to start first, though does not verify if postgres is ready, need to add a healthcheck
    networks:
      - hikayat-net # services on the same network can reach each other by service name as hostname

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432" # inspect the local postgres client via this port, should be removed in stricter production setup
    volumes:
      - hikayat-data:/var/lib/postgresql/data
    networks:
      - hikayat-net

networks:
  hikayat-net:
    driver: bridge

volumes:
  hikayat-data:
